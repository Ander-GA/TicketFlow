spring.application.name=ticketflow

# Perfil de desarrollo local
spring.profiles.active=local

# Conexion con MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ticketflow_db?useSSL=false&serverTimezone=Europe/Madrid&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Almacenamiento local de imagenes de eventos
ticketflow.imagenes.directorio=${TICKETFLOW_IMAGENES_DIRECTORIO:./uploads/eventos}

# Limites de subida de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB